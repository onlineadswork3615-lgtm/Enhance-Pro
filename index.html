<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelBoost — AI Image Enhancer</title>
  <meta name="description" content="Enhance and upscale your images for free with AI." />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ===== TOP AD SLOT ===== -->
  <div class="ad-slot ad-top">
    <!-- PASTE YOUR ADSTERRA BANNER SCRIPT HERE -->
    <span class="ad-placeholder">Advertisement</span>
  </div>

  <header class="site-header">
    <div class="logo">✨ PixelBoost</div>
    <nav>
      <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">🌙</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Enhance Your Images with <span>AI</span></h1>
      <p>Upscale, sharpen, and restore photos in seconds. No signup. No watermark. 100% Free.</p>

      <!-- UPLOAD AREA -->
      <div class="upload-container">
        <div id="dropzone" class="dropzone">
          <input type="file" id="fileInput" accept="image/*" hidden />
          <div class="dz-content">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <p><strong>Choose an image</strong> or drag & drop</p>
            <p class="dz-sub">PNG, JPG, WEBP — max 10 MB</p>
          </div>
        </div>

        <div id="previewArea" class="preview-area hidden">
          <!-- BEFORE AND AFTER SLIDER -->
          <div class="comparison-container">
            <div class="img-wrapper">
              <img id="beforeImg" alt="Before" />
              <span class="img-label">Original</span>
            </div>
            <div class="img-wrapper">
              <img id="afterImg" alt="After" />
              <span class="img-label">Enhanced</span>
            </div>
          </div>
          
          <div class="actions">
            <button id="enhanceBtn" class="btn primary">✨ Enhance Now</button>
            <a id="downloadBtn" class="btn secondary hidden" download="enhanced.png">⬇ Download</a>
            <button id="resetBtn" class="btn outline">↺ New Image</button>
          </div>
          <p id="status" class="status"></p>
        </div>
      </div>
    </section>

    <!-- ===== IN-CONTENT AD SLOT ===== -->
    <div class="ad-slot ad-content">
      <!-- PASTE YOUR ADSTERRA 300x250 SCRIPT HERE -->
      <span class="ad-placeholder">Advertisement</span>
    </div>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> PixelBoost — Made for Creators</p>
  </footer>

  <!-- লাইব্রেরি: ব্রাউজারে AI চালানোর জন্য -->
  <script src="https://cdn.jsdelivr.net/npm/upscaler@1.0.0/dist/browser/upscaler.min.js"></script>
  <script src="script.js"></script>

  <!-- ===== POPUNDER / SOCIAL BAR ===== -->
  <!-- PASTE YOUR ADSTERRA POPUNDER SCRIPT HERE -->
</body>
</html>
